<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">agent harness — from a question to a verified patch</title>
  <desc id="desc">A local agent workspace with your own model key. Ask about the project, run an isolated coding task, verify it independently, and review the patch and evidence.</desc>
  <rect width="1200" height="420" rx="22" fill="#f1f5ed"/>
  <g id="identity" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <rect x="56" y="44" width="40" height="40" rx="8" fill="#245c49"/>
    <text x="68" y="74" font-family="Georgia,serif" font-size="35" fill="#ffffff">h</text>
    <text x="114" y="71" font-size="18" font-weight="600" letter-spacing="2" fill="#51685b">LOCAL AGENT WORKSPACE</text>
    <text x="1144" y="71" text-anchor="end" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#51685b">BRING YOUR OWN KEY</text>
    <text x="53" y="186" font-size="92" font-weight="650" letter-spacing="-5" fill="#183c2e">agent harness</text>
    <text x="58" y="246" font-size="40" letter-spacing="-1" fill="#345845">From a question to a verified patch.</text>
  </g>
  <path d="M56 286H1144" stroke="#cbd8c5" stroke-width="2"/>
  <g id="workflow" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="34" font-weight="600" fill="#183c2e">
    <circle cx="72" cy="350" r="8" fill="#245c49"/>
    <text x="98" y="362">Ask</text>
    <path d="M208 350H302m-12-8 12 8-12 8" fill="none" stroke="#8ca48e" stroke-width="2"/>
    <rect x="360" y="342" width="16" height="16" rx="3" fill="#245c49"/>
    <text x="395" y="362">Run</text>
    <path d="M503 350H604m-12-8 12 8-12 8" fill="none" stroke="#8ca48e" stroke-width="2"/>
    <path d="m667 350 7 7 13-16" fill="none" stroke="#245c49" stroke-width="4"/>
    <text x="705" y="362">Verify</text>
    <path d="M846 350H920m-12-8 12 8-12 8" fill="none" stroke="#8ca48e" stroke-width="2"/>
    <path d="M972 340h18m-18 10h24m-24 10h18" stroke="#245c49" stroke-width="3"/>
    <text x="1010" y="362">Review</text>
  </g>
</svg>
