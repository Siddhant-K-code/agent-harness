name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check baseline budget and interruption accounting
        run: python3 scripts/test-real-tasks.py
      - run: sh integrations/agenttrace/setup.sh
      - run: docker pull node:22-alpine
      - name: Build and test Linux command isolation
        run: |
          CGO_ENABLED=0 GOOS=linux go build -o infra/aws/agentcore/harness-service ./cmd/agentcore-service
          docker build -t agent-harness-guard:test infra/aws/agentcore
          docker run --rm -i --entrypoint python3 -v "$PWD/infra/aws/agentcore/isolation/test_guard.py:/opt/test_guard.py:ro" -v "$PWD/examples/normalize-tags:/opt/fixture:ro" -v "$PWD/docs/evidence/2026-09-05/changes.patch:/opt/candidate.patch:ro" agent-harness-guard:test /opt/test_guard.py
      - run: HARNESS_AGENTTRACE_PYTHON="$PWD/.harness/agenttrace-venv/bin/python" go test -race ./...
        env:
          HARNESS_DOCKER_TEST: '1'
          HARNESS_AGENTCORE_DOCKER_TEST: '1'
      - run: go vet ./...
      - run: go build ./cmd/harness
  real-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker pull python:3.12-slim
      - name: Verify buggy bases fail and upstream fixes pass
        run: python3 scripts/prepare-real-tasks.py --output .harness/corpus-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-corpus-validation
          path: |
            .harness/corpus-validation/*.log
            .harness/corpus-validation/prepared.json
          if-no-files-found: ignore
          include-hidden-files: true
