name: Package and signed release
on:
  pull_request:
    paths: ['cmd/harness/**', 'internal/**', 'examples/**', 'integrations/agenttrace/**', 'scripts/**', 'security/**', 'go.*', 'docs/getting-started.md', 'docs/compaction-and-learning.md', 'docs/ui-and-integrations.md', 'LICENSE', '.github/workflows/package.yml']
  push:
    branches: [main]
    paths: ['cmd/harness/**', 'internal/**', 'examples/**', 'integrations/agenttrace/**', 'scripts/**', 'security/**', 'go.*', 'docs/getting-started.md', 'docs/compaction-and-learning.md', 'docs/ui-and-integrations.md', 'LICENSE', '.github/workflows/package.yml']
  workflow_dispatch:
    inputs:
      version:
        description: Explicit release version (for example v0.1.0-rc.6)
        default: v0.1.0-rc.6
        required: true
      draft_release:
        description: Sign artifacts and create a draft prerelease after package checks
        type: boolean
        default: false
      publish_release:
        description: Publish the signed draft after downloaded assets verify (repository visibility is unchanged)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # Release builds must not block push/PR checks. Keep every queued commit.
  group: package-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, arch: amd64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64}
          - {runner: macos-15-intel, os: darwin, arch: amd64}
          - {runner: macos-15, os: darwin, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      PACKAGE_VERSION: ${{ inputs.version || 'v0.0.0-dev' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check credential and task setup behavior
        run: go test -race ./cmd/harness ./internal/credentials ./internal/scaffold ./internal/model ./internal/skills ./internal/learning ./internal/evaluation ./internal/contextwindow ./internal/runner ./internal/chat ./internal/dashboard ./internal/workspace
      - name: Build archive and dependency notices
        run: sh scripts/package.sh "$PACKAGE_VERSION" "${{ matrix.os }}" "${{ matrix.arch }}"
      - name: Install and exercise the native archive (no model or AWS calls)
        run: python3 scripts/smoke-package.py "dist/agent-harness_${PACKAGE_VERSION}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz"
      - name: Verify signed bootstrap, real installation, and tampering rejection
        run: python3 scripts/test-release.py --archive "dist/agent-harness_${PACKAGE_VERSION}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
  draft:
    if: github.event_name == 'workflow_dispatch' && inputs.draft_release && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PACKAGE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Sign the tested artifacts and verify against the pinned public key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.HARNESS_RELEASE_SIGNING_KEY }}
        run: |
          set -eu
          test -n "$RELEASE_SIGNING_KEY" || { echo 'HARNESS_RELEASE_SIGNING_KEY must be configured before requesting a signed release.' >&2; exit 1; }
          umask 077
          signing_file=$(mktemp "$RUNNER_TEMP/harness-signing.XXXXXX")
          trap 'rm -f "$signing_file"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$signing_file"
          unset RELEASE_SIGNING_KEY
          python3 scripts/sign-release.py "$PACKAGE_VERSION" "$GITHUB_SHA" --key-file "$signing_file"
      - name: Create signed draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          python3 - <<'PY'
          import os
          from pathlib import Path
          sha, version = os.environ['GITHUB_SHA'], os.environ['PACKAGE_VERSION']
          Path('release-notes.md').write_text(f'''Ask about a project, delegate a coding task, and review its independently verified patch. Native CLI and embedded local web app for macOS/Linux on Intel/AMD and ARM, licensed under MIT.

          Included in this build:

          - Real OpenAI project Q&A and isolated coding, with configurable model/context settings and explicit spending limits.
          - Persistent local chat, source references, editable task handoff, verifier results, patches and cleanup evidence.
          - Budgeted compaction, scoped skills, evaluated revision promotion/rollback, native AgentTrace, selected MCP tools and GitHub reads.
          - Signature-verifying installation, optional complete local setup, LICENSE and third-party notices.

          All four archives are project-signed through an RSA-3072/SHA-256 checksum manifest. The installer verifies the pinned project key before extraction. These are not Apple Developer ID signed or notarized builds.

          **Install and start the app.** Requires Git, OpenSSL, Python 3.12+ with venv, authenticated GitHub CLI with repository access, and a running Docker daemon. Choose a new setup directory:

          ```sh
          (
            set -eu
            installer=$(mktemp)
            trap 'rm -f "$installer"' EXIT
            gh api -H 'Accept: application/vnd.github.raw+json' 'repos/Siddhant-K-code/agent-harness/contents/scripts/install-release.py?ref={sha}' > "$installer"
            python3 "$installer" --version {version} --setup "$HOME/harness-demo" --with-docker --with-trace --login --serve
          )
          ```

          Open the complete local access link printed by the server. Setup pulls the demo image, installs pinned AgentTrace, reuses or prompts locally for an OpenAI key, and starts the app. It submits no paid model requests; project questions and coding runs use your OpenAI account when submitted.

          For CLI-only installation, omit `--setup` and the flags after it; Python 3.9+ is sufficient. Add `--force` explicitly when replacing an installed CLI. Keep `~/.local/bin` on PATH. To restart the same project later, run `cd ~/harness-demo` then `harness serve --task harness.task.json`; do not repeat initial setup.

          [Setup and prerequisites](https://github.com/Siddhant-K-code/agent-harness/blob/{sha}/docs/getting-started.md) · [Changes and historical drafts](https://github.com/Siddhant-K-code/agent-harness/blob/{sha}/CHANGELOG.md) · [Signature verification](https://github.com/Siddhant-K-code/agent-harness/blob/{sha}/docs/release-verification.md).

          This is a local, single-user preview. OpenAI is the implemented provider. Reviewed GitHub writes, MCP OAuth/stdio, automatic crash resume and Apple notarization are not included. A passing verifier establishes its checks, not arbitrary correctness; the recorded demos are not broad quality benchmarks.

          Source commit: `{sha}`.
          ''')
          PY
          gh release create "$PACKAGE_VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --title "agent-harness $PACKAGE_VERSION" --notes-file release-notes.md
      - name: Download and authenticate uploaded assets before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release download "$PACKAGE_VERSION" --repo "$GITHUB_REPOSITORY" --dir downloaded-release
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('installer', 'scripts/install-release.py')
          installer = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(installer)
          _, metadata = installer.verify_release(Path('downloaded-release'), os.environ['PACKAGE_VERSION'], 'linux_amd64', all_files=True)
          assert metadata['commit'] == os.environ['GITHUB_SHA'], 'Uploaded release source does not match this run'
          print('All uploaded artifacts authenticated against the committed public key.')
          PY
      - name: Publish verified prerelease
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$PACKAGE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
