name: AWS AgentCore probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-harness-aws-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned AgentTrace
        run: sh integrations/agenttrace/setup.sh
      - name: Check repository variables
        env:
          DEPLOY_ROLE: ${{ vars.AGENT_HARNESS_AWS_ROLE_ARN }}
          RUNTIME_ROLE: ${{ vars.AGENT_HARNESS_AWS_RUNTIME_ROLE_ARN }}
        run: |
          test -n "$DEPLOY_ROLE" || { echo '::error::Set repository variable AGENT_HARNESS_AWS_ROLE_ARN from the bootstrap DeploymentRoleArn output.'; exit 1; }
          test -n "$RUNTIME_ROLE" || { echo '::error::Set repository variable AGENT_HARNESS_AWS_RUNTIME_ROLE_ARN from the bootstrap RuntimeRoleArn output.'; exit 1; }
      - name: Build and check protocol
        run: |
          HARNESS_AGENTTRACE_PYTHON="$PWD/.harness/agenttrace-venv/bin/python" go test ./internal/sandbox/agentcore ./internal/trace/agenttrace
          go build -o bin/agentcore-probe ./cmd/agentcore-probe
      - name: Obtain short-lived scoped credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AGENT_HARNESS_AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 1800
          role-session-name: harness-probe-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Authenticate ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push ARM64 image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          PROBE_TAG: probe-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          image="$REGISTRY/agent-harness-probe:$PROBE_TAG"
          docker buildx build --platform linux/arm64 --provenance=false --load --pull -t "$image" infra/aws/agentcore
          docker run --rm -i --entrypoint python3 -v "$PWD/infra/aws/agentcore/isolation/test_guard.py:/opt/test_guard.py:ro" -v "$PWD/examples/normalize-tags:/opt/fixture:ro" -v "$PWD/docs/evidence/2026-09-05/changes.patch:/opt/candidate.patch:ro" "$image" /opt/test_guard.py
          docker push "$image"
          digest=$(aws ecr describe-images --repository-name agent-harness-probe --image-ids "imageTag=$PROBE_TAG" --query 'imageDetails[0].imageDigest' --output text)
          echo "uri=$REGISTRY/agent-harness-probe@$digest" >> "$GITHUB_OUTPUT"
          echo "tag=$PROBE_TAG" >> "$GITHUB_OUTPUT"
      - name: Run real capability checks
        env:
          PROBE_IMAGE: ${{ steps.image.outputs.uri }}
          EXECUTION_ROLE: ${{ vars.AGENT_HARNESS_AWS_RUNTIME_ROLE_ARN }}
        run: bin/agentcore-probe --image "$PROBE_IMAGE" --execution-role "$EXECUTION_ROLE" > .harness-probe-report.json
      - name: Reconcile runtime cleanup
        if: always()
        run: |
          if [ -f .harness/aws-probe.json ]; then
            bin/agentcore-probe --cleanup
          fi
      - name: Expire owned logs and remove probe image
        if: always() && steps.ecr.outcome == 'success'
        env:
          PROBE_TAG: ${{ steps.image.outputs.tag }}
        run: python3 infra/aws/agentcore/cleanup.py
      - name: Export and verify native remote trace
        if: always()
        run: |
          if [ -f .harness/aws-probe.json.trace.json ]; then
            bin/agentcore-probe --export-trace > .harness/aws-trace-export.json
            bin/agentcore-probe --export-trace > .harness/aws-trace-export-repeat.json
            .harness/agenttrace-venv/bin/python integrations/agenttrace/verify_remote.py
          fi
      - name: Save private evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentcore-probe-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 7
          path: |
            .harness/aws-probe*.json
            .harness-probe-report.json
            .harness/aws-traces/
            .harness/aws-trace*.json
            .harness/aws-trace-replay.html
            .harness/aws-trace-replay.txt
